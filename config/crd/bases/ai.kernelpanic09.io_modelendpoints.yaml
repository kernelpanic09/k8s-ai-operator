---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelendpoints.ai.kernelpanic09.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: ai.kernelpanic09.io
  names:
    categories:
    - ai
    kind: ModelEndpoint
    listKind: ModelEndpointList
    plural: modelendpoints
    shortNames:
    - me
    singular: modelendpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.modelId
      name: Model
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .status.available
      name: Available
      type: boolean
    - jsonPath: .status.costThisMonth
      name: Cost/Month
      type: string
    - jsonPath: .status.invocationsToday
      name: Invocations
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelEndpoint is the control-plane representation of an AWS Bedrock
          model. Creating one causes the operator to spin up a proxy Service in the
          same namespace.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              costBudget:
                description: CostBudget sets hard spending limits.
                properties:
                  daily:
                    pattern: ^\d+(\.\d{1,2})?$
                    type: string
                  monthly:
                    pattern: ^\d+(\.\d{1,2})?$
                    type: string
                type: object
              guardrailPolicyRef:
                description: GuardrailPolicyRef references a cluster-scoped GuardrailPolicy.
                type: string
              irsaRoleArn:
                description: IRSARoleArn is the ARN of the IAM role assumed via IRSA.
                maxLength: 2048
                minLength: 1
                pattern: ^arn:aws:iam::\d{12}:role/.+$
                type: string
              maxTokens:
                description: MaxTokens caps max_tokens sent to Bedrock.
                format: int32
                maximum: 131072
                minimum: 1
                type: integer
              modelId:
                description: ModelId is the Bedrock model identifier.
                maxLength: 256
                minLength: 1
                type: string
              rateLimit:
                description: RateLimit controls request throughput via a token bucket.
                properties:
                  requestsPerMinute:
                    format: int32
                    maximum: 3600
                    minimum: 1
                    type: integer
                required:
                - requestsPerMinute
                type: object
              region:
                description: Region is the AWS region where Bedrock invocations are sent.
                pattern: ^[a-z]{2}-[a-z]+-\d+$
                type: string
            required:
            - irsaRoleArn
            - modelId
            - region
            type: object
          status:
            properties:
              available:
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              costThisMonth:
                type: string
              costToday:
                type: string
              invocationsToday:
                format: int64
                type: integer
              observedGeneration:
                format: int64
                type: integer
              serviceName:
                type: string
              totalInputTokens:
                format: int64
                type: integer
              totalOutputTokens:
                format: int64
                type: integer
            required:
            - available
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
