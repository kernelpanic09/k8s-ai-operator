---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: guardrailpolicies.ai.kernelpanic09.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: ai.kernelpanic09.io
  names:
    categories:
    - ai
    kind: GuardrailPolicy
    listKind: GuardrailPolicyList
    plural: guardrailpolicies
    shortNames:
    - gp
    singular: guardrailpolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.guardrailId
      name: GuardrailId
      type: string
    - jsonPath: .status.guardrailVersion
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=="GuardrailSynced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GuardrailPolicy is a cluster-scoped resource that mirrors content
          moderation rules to Bedrock's Guardrails API.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              blockedInputMessage:
                maxLength: 500
                type: string
              blockedOutputsMessage:
                maxLength: 500
                type: string
              contentPolicy:
                properties:
                  filters:
                    items:
                      properties:
                        inputStrength:
                          default: MEDIUM
                          enum:
                          - NONE
                          - LOW
                          - MEDIUM
                          - HIGH
                          type: string
                        outputStrength:
                          default: MEDIUM
                          enum:
                          - NONE
                          - LOW
                          - MEDIUM
                          - HIGH
                          type: string
                        type:
                          enum:
                          - SEXUAL
                          - VIOLENCE
                          - HATE
                          - INSULTS
                          - MISCONDUCT
                          - PROMPT_ATTACK
                          type: string
                      required:
                      - inputStrength
                      - outputStrength
                      - type
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - type
                    x-kubernetes-list-type: map
                type: object
              description:
                maxLength: 200
                type: string
              sensitiveInformationPolicy:
                properties:
                  piiEntities:
                    items:
                      properties:
                        action:
                          enum:
                          - BLOCK
                          - ANONYMIZE
                          type: string
                        type:
                          type: string
                      required:
                      - action
                      - type
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - type
                    x-kubernetes-list-type: map
                type: object
              topicPolicy:
                properties:
                  topics:
                    items:
                      properties:
                        definition:
                          minLength: 1
                          type: string
                        examples:
                          items:
                            type: string
                          type: array
                        name:
                          minLength: 1
                          type: string
                      required:
                      - definition
                      - name
                      type: object
                    type: array
                type: object
              wordPolicy:
                properties:
                  managedWordLists:
                    items:
                      enum:
                      - PROFANITY
                      type: string
                    type: array
                  words:
                    items:
                      type: string
                    type: array
                type: object
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    reason:
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              guardrailId:
                type: string
              guardrailVersion:
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
