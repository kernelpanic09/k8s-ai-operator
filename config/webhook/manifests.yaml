---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: k8s-ai-operator-validating
  annotations:
    # cert-manager injects the caBundle automatically when this annotation is present.
    cert-manager.io/inject-ca-from: ai-operator-system/k8s-ai-operator-serving-cert
spec:
  webhooks:
  - name: vmodelendpoint.kb.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: k8s-ai-operator-webhook
        namespace: ai-operator-system
        path: /validate-ai-kernelpanic09-io-v1alpha1-modelendpoint
    failurePolicy: Fail
    rules:
    - apiGroups: ["ai.kernelpanic09.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["modelendpoints"]
    sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: k8s-ai-operator-mutating
  annotations:
    cert-manager.io/inject-ca-from: ai-operator-system/k8s-ai-operator-serving-cert
spec:
  webhooks:
  - name: mmodelendpoint.kb.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: k8s-ai-operator-webhook
        namespace: ai-operator-system
        path: /mutate-ai-kernelpanic09-io-v1alpha1-modelendpoint
    failurePolicy: Fail
    rules:
    - apiGroups: ["ai.kernelpanic09.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE"]
      resources: ["modelendpoints"]
    sideEffects: None
